<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Vitrin Arama Listesi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<style>
  :root{color-scheme:light;--bg:#fff;--fill:#f5f5f7;--fill-h:#ebebef;--ink:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7;--brand:#0071e3;--brand-h:#0077ed;--ok:#1d8a3e;--warn:#b25e00;--bad:#d70015}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.022em;margin:0}
  .stats{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
  .stats>span{white-space:nowrap}
  .stats b{color:var(--ink);font-weight:600}
  .link{background:none;border:0;padding:0;font:inherit;color:var(--brand);cursor:pointer}
  .link:hover{text-decoration:underline}
  nav{display:inline-flex;background:var(--fill);padding:3px;border-radius:10px;margin-bottom:20px}
  nav button{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--ink);padding:6px 20px;border-radius:8px;cursor:pointer}
  nav button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .card{background:var(--fill);border-radius:22px;padding:28px}
  .name{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .meta{color:var(--mute);font-size:15px}
  a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
  .phone{display:block;margin:18px 0 6px;font-size:34px;font-weight:600;letter-spacing:-.01em;color:var(--brand)}
  .phone:hover{text-decoration:none;color:var(--brand-h)}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
  .tag{font-size:13px;padding:3px 11px;border-radius:999px;background:#fff;color:var(--mute)}
  textarea,input,select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
  textarea:focus,input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
  textarea{min-height:96px;margin:20px 0 4px;resize:vertical}
  .btn{font:inherit;font-size:15px;font-weight:500;border:0;background:#fff;color:var(--ink);padding:13px 14px;border-radius:12px;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--fill-h)}
  .btn:active{transform:scale(.99)}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-h)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .row2{display:flex;gap:8px;margin-top:12px}
  .row2>*{flex:1}
  .muted{color:var(--mute)}
  .skip{display:block;margin:18px auto 0;font-size:14px}
  .wa{display:flex;gap:8px;align-items:center;margin-top:16px}
  .wa .btn{flex:1;background:#1faa59;color:#fff;font-weight:600}
  .wa .btn:hover{background:#198f4a}
  .wa .btn[disabled]{background:#fff;color:var(--mute);cursor:default}
  .wa .link{font-size:14px;white-space:nowrap}
  #tplBox{margin-top:10px}
  #tplBox textarea{min-height:150px;margin:6px 0 0;font-size:14px}
  .wahint{font-size:13px;color:var(--mute);margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--mute);font-weight:500;font-size:13px}
  tr:last-child td{border-bottom:0}
  nav{max-width:100%;overflow-x:auto}
  nav button .n{font-size:12px;color:var(--mute);margin-left:4px}
  nav button.on .n{color:var(--brand)}
  .btn[disabled]{opacity:.5;cursor:default}
  .wa-extra{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:14px}
  .plan{margin:14px 0 0;font-size:14px}
  .plan .u{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .plan .u:last-child{border-bottom:0}
  .bar{height:6px;border-radius:999px;background:#fff;overflow:hidden;margin:14px 0 6px}
  .bar>i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
  .log{font-size:14px;margin-top:10px}
  .log div{padding:6px 0;border-bottom:1px solid var(--line)}
  .chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin:12px 0 0}
  .chk input{width:auto}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);background:rgba(29,29,31,.92);color:#fff;font-size:15px;padding:11px 20px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
  #toast.on{opacity:1;transform:translateX(-50%)}
  .hide{display:none!important}
  .center{text-align:center;padding:56px 20px;color:var(--mute)}
  label{font-size:13px;color:var(--mute);display:block;margin:0 0 6px 2px}
  #login{max-width:360px;margin:12vh auto 0;background:none;padding:0;text-align:center}
  #login h1{margin-bottom:6px} #login p.sub{color:var(--mute);margin:0 0 28px}
  #login form{text-align:left}
  @media (max-width:480px){h1{font-size:28px}.card{padding:22px;border-radius:20px}.phone{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">

  <!-- Giriş -->
  <div id="login" class="card hide">
    <h1>Vitrin</h1><p class="sub">Arama listesine giriş yap</p>
    <form id="loginForm">
      <label>E-posta</label><input id="email" type="email" autocomplete="username" required>
      <div style="height:14px"></div>
      <label>Şifre</label><input id="password" type="password" autocomplete="current-password" required>
      <div style="height:14px"></div>
      <button class="btn primary" style="width:100%">Giriş yap</button>
      <p id="loginErr" class="bad" style="margin:12px 0 0;font-size:14px;text-align:center"></p>
    </form>
  </div>

  <!-- Uygulama -->
  <div id="app" class="hide">
    <header>
      <h1>Vitrin</h1>
      <div class="stats">
        <span>Hafta <b id="weekCount">0</b>/<span id="weekGoal">100</span></span>
        <span>Bugün <b id="todayCount">0</b></span>
        <span>WhatsApp <b id="waToday">0</b>/<span id="waLimit">25</span></span>
        <button class="link" id="logout">Çıkış</button>
      </div>
    </header>
    <nav id="tabs">
      <button data-tab="whatsapp" class="on">WhatsApp<span class="n" id="n_whatsapp"></span></button>
      <button data-tab="call">Arama<span class="n" id="n_call"></span></button>
      <button data-tab="followup">Takip<span class="n" id="n_followup"></span></button>
      <button data-tab="hist">Geçmiş</button>
      <button data-tab="scan">Tara</button>
    </nav>

    <!-- Arama sekmesi -->
    <section id="callView">
      <div class="row2" style="margin:0 0 16px">
        <select id="cityFilter"><option value="">Tüm şehirler</option></select>
        <select id="sectorFilter"><option value="">Tüm sektörler</option></select>
      </div>
      <div id="empty" class="card center hide" aria-live="polite">Bu listede şu an işletme yok.<br>Başka sekmeye bakın, filtreyi değiştirin veya yeni bölge taratın.</div>
      <div id="biz" class="card hide">
        <p class="name" id="bName"></p>
        <div class="meta" id="bAddr"></div>
        <div class="tags" id="bTags"></div>
        <a id="bPhone" class="phone"></a>
        <div class="meta"><a id="bMaps" target="_blank" rel="noopener">Google Haritalar'da aç</a></div>
        <div id="bHistory" class="meta" style="margin-top:8px"></div>

        <div class="wa">
          <button class="btn" id="waBtn">WhatsApp'tan yaz</button>
          <button class="link" id="tplToggle">Mesajı düzenle</button>
        </div>
        <div class="wahint" id="waHint"></div>
        <div class="wa-extra"><button class="link" id="toCallList">Arama listesine al</button></div>
        <div id="tplBox" class="hide">
          <label>Mesaj şablonu ({isim} işletme adıyla değişir; "dur" cümlesini silme)</label>
          <textarea id="tplText"></textarea>
          <div class="row2"><button class="btn" id="tplReset">Varsayılana dön</button><button class="btn primary" id="tplSave">Kaydet</button></div>
        </div>

        <textarea id="note" placeholder="Görüşme notu (kiminle konuşuldu, ne dedi, ne zaman tekrar aransın...)"></textarea>

        <div class="grid">
          <button class="btn ok" data-o="wa_sent" id="btnWaSent">WhatsApp gönderdim</button>
          <button class="btn warn" data-o="no_answer">Açmadı / ulaşılamadı</button>
          <button class="btn" data-o="callback">Sonra ara…</button>
          <button class="btn ok" data-o="interested">İlgilendi</button>
          <button class="btn ok" data-o="won">Satış oldu</button>
          <button class="btn bad" data-o="rejected">İlgilenmiyor</button>
          <button class="btn bad" data-o="do_not_contact">Dur dedi / bir daha yazma</button>
          <button class="btn" data-o="wrong_number">Yanlış numara</button>
          <button class="btn" data-o="closed_business">İşletme kapalı</button>
        </div>
        <div id="cbBox" class="hide" style="margin-top:10px">
          <label>Ne zaman aransın?</label>
          <div class="row2">
            <input id="cbAt" type="datetime-local">
            <button class="btn primary" id="cbSave" style="flex:0 0 auto">Kaydet</button>
          </div>
        </div>
        <div><button class="link muted skip" id="skip">Şimdilik atla</button></div>
      </div>
    </section>

    <!-- Geçmiş sekmesi -->
    <section id="histView" class="hide">
      <input id="histSearch" placeholder="İşletme adı veya not ara…" style="margin-bottom:10px">
      <div class="card" style="padding:8px 16px"><table id="histTable"></table></div>
    </section>

    <!-- Tarama sekmesi -->
    <section id="scanView" class="hide">
      <div class="card">
        <label for="scCity">Şehir</label>
        <input id="scCity" placeholder="Ankara" autocomplete="off">
        <div style="height:12px"></div>
        <label for="scDistricts">İlçeler (virgülle ayır; boş bırakırsan tüm şehir)</label>
        <input id="scDistricts" placeholder="Çankaya, Keçiören" autocomplete="off">
        <div style="height:12px"></div>
        <label for="scSectors">Sektörler (virgülle ayır)</label>
        <input id="scSectors" placeholder="kuaför, diş hekimi" autocomplete="off">
        <label class="chk"><input type="checkbox" id="scForce"> 90 gün içinde taranmış olsa da yeniden tara</label>
        <div class="row2"><button class="btn primary" id="scPlan">Planı göster</button></div>
        <div id="scPlanBox" class="plan hide"></div>
        <div class="row2 hide" id="scRunRow"><button class="btn primary" id="scRun">Taramayı başlat</button></div>
        <div id="scProg" class="hide"><div class="bar"><i id="scBar"></i></div><div class="meta" id="scProgTxt"></div>
          <div class="row2"><button class="btn bad" id="scStop">Durdur</button></div></div>
        <div class="log" id="scLog" aria-live="polite"></div>
      </div>
      <div class="meta" style="margin:16px 4px 6px">Son taramalar</div>
      <div class="card" style="padding:8px 16px"><table id="scHist"></table></div>
    </section>
  </div>
</div>
<div id="toast"></div>

<script>
// ====== AYAR: Supabase > Project Settings > API ======
const SUPABASE_URL      = 'https://iskydzodfqyhkfdixnmy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VHrB2x1ZRNw8Yisoh2zSwA_M4jgu8Ym';   // publishable key tarayıcıya konabilir; secret key ASLA
const WEEKLY_GOAL       = 100;
// =====================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const OUTCOME_TR = {wa_sent:'WhatsApp gönderildi', no_answer:'Açmadı', callback:'Sonra aranacak', interested:'İlgilendi', won:'Satış',
  rejected:'İlgilenmiyor', do_not_contact:'Dur dedi / aramayın', wrong_number:'Yanlış numara', closed_business:'Kapalı'};
const WEB_TR = {none:'Web sitesi yok', social_only:'Sadece sosyal medya'};
let current = null, skipped = new Set(), busy = false, waTodayCount = 0;
const WA_DAILY_LIMIT = 25;   // önerilen günlük üst sınır (engellemez, uyarır)

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }
function fmt(d){ return d ? new Date(d).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'}) : ''; }
function addTag(parent, text){ const s=document.createElement('span'); s.className='tag'; s.textContent=text; parent.appendChild(s); }

// ---- Yardımcılar ----
const LISTS = ['whatsapp','call','followup'];
let list = 'whatsapp', seq = 0;
const fail = (e)=>{ console.error(e); toast('Hata: '+(e && e.message ? e.message : e)); };

// ---- Oturum ----
async function init(){
  $('weekGoal').textContent = WEEKLY_GOAL; $('waLimit').textContent = WA_DAILY_LIMIT;
  const { data:{ session } } = await sb.auth.getSession();
  session ? showApp() : showLogin();
}
function showLogin(){ current=null; $('login').classList.remove('hide'); $('app').classList.add('hide'); $('password').value=''; }
async function showApp(){
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  await Promise.all([loadFilters(), refreshCounts()]); await loadNext();
}
$('loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); $('loginErr').textContent='';
  const { error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('password').value });
  error ? $('loginErr').textContent='E-posta veya şifre hatalı.' : showApp();
});
$('logout').onclick = async ()=>{ await release(); await sb.auth.signOut(); showLogin(); };
async function release(){ if(current){ const id=current.id; current=null; await sb.rpc('release_business',{p_business_id:id}); } }

// ---- Filtreler (şehir/sektör) ----
async function loadFilters(){
  const { data, error } = await sb.rpc('filter_options');
  if(error){ fail(error); return; }
  const cities=[...new Set((data||[]).map(r=>r.city).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  const sectors=[...new Set((data||[]).map(r=>r.sector).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
  const fill=(sel,items,all)=>{ const v=sel.value; sel.replaceChildren(new Option(all,'')); items.forEach(x=>sel.add(new Option(x,x))); sel.value=items.includes(v)?v:''; };
  fill($('cityFilter'),cities,'Tüm şehirler'); fill($('sectorFilter'),sectors,'Tüm sektörler');
}
$('cityFilter').onchange = $('sectorFilter').onchange = async ()=>{ await release(); skipped.clear(); await refreshCounts(); await loadNext(); };

// ---- Sayaçlar ----
async function refreshCounts(){
  const [st, ct] = await Promise.all([
    sb.rpc('stats'),
    sb.rpc('list_counts',{ p_city:$('cityFilter').value||null, p_sector:$('sectorFilter').value||null })
  ]);
  if(st.error) fail(st.error); else {
    const s=(st.data&&st.data[0])||{};
    $('weekCount').textContent = s.week_total ?? 0; $('todayCount').textContent = s.today_total ?? 0;
    waTodayCount = Number(s.today_wa ?? 0); $('waToday').textContent = waTodayCount;
    $('waToday').parentElement.classList.toggle('warn', waTodayCount >= WA_DAILY_LIMIT);
  }
  if(ct.error) fail(ct.error); else {
    const m = Object.fromEntries((ct.data||[]).map(r=>[r.lst, Number(r.n)]));
    LISTS.forEach(l=>{ $('n_'+l).textContent = m[l] ? ' '+m[l] : ''; });
  }
}

// ---- Sıradaki işletme (sunucu seçer ve 15 dk kilitler: iki kişi aynı kartı görmez) ----
async function loadNext(){
  const my = ++seq;
  current = null; $('cbBox').classList.add('hide'); $('note').value='';
  const r = await sb.rpc('next_business',{ p_list:list, p_city:$('cityFilter').value||null,
                                           p_sector:$('sectorFilter').value||null, p_skip:[...skipped] });
  if(my !== seq) return;                       // aradan başka bir istek geçtiyse bunu yok say
  if(r.error){ $('biz').classList.add('hide'); fail(r.error); return; }
  const pick = (r.data||[])[0];
  if(!pick){ $('biz').classList.add('hide'); $('empty').classList.remove('hide'); return; }
  current = pick; $('empty').classList.add('hide'); $('biz').classList.remove('hide');
  $('bName').textContent = pick.name;
  $('bAddr').textContent = pick.address || '';
  const tags=$('bTags'); tags.replaceChildren();
  addTag(tags, `${pick.rating} ★ (${pick.review_count} yorum)`);
  addTag(tags, WEB_TR[pick.website_status] || pick.website_status);
  addTag(tags, pick.sector); addTag(tags, [pick.city,pick.district].filter(Boolean).join(' / '));
  addTag(tags, `Skor ${pick.lead_score}`);
  const ph=$('bPhone'); ph.textContent = pick.phone_raw; ph.href = 'tel:'+(pick.phone_normalized||'');
  setupWa(pick); $('tplBox').classList.add('hide');
  const okMaps=/^https:\/\//.test(pick.maps_url||''); const mp=$('bMaps'); mp.href = okMaps ? pick.maps_url : '#'; mp.classList.toggle('hide',!okMaps);
  const h=$('bHistory'); h.textContent='';
  if(pick.attempt_count>0){
    const c = await sb.from('calls').select('called_at,outcome,note').eq('business_id',pick.id).order('called_at',{ascending:false}).limit(3);
    if(my !== seq) return;
    h.textContent = 'Önceki: ' + (c.data||[]).map(x=>`${fmt(x.called_at)} – ${OUTCOME_TR[x.outcome]}${x.note?' ('+x.note+')':''}`).join(' • ');
  }
}

// ---- WhatsApp (yarı elle) ----
const DEFAULT_TPL = "Merhaba, {isim} için yazıyorum. Vitrin Web olarak küçük işletmelere hızlı ve uygun fiyatlı web sitesi hazırlıyoruz. Google Haritalar'daki yüksek puanınızı bir web sitesiyle güçlendirmek isteriz. İlgilenirseniz kısaca bilgi verebilirim.\n\nBu mesajı istemiyorsanız \"dur\" yazmanız yeterli, bir daha yazmayacağız.\nvitrinweb.com.tr";
function getTpl(){ try{ return localStorage.getItem('vitrin_wa_tpl') || DEFAULT_TPL; }catch(e){ return DEFAULT_TPL; } }
function setTpl(v){ try{ v ? localStorage.setItem('vitrin_wa_tpl',v) : localStorage.removeItem('vitrin_wa_tpl'); }catch(e){} }
function shortName(n){
  let x = (n||'').split(/\s[\/|]\s|\s-\s|\s\|\s|\/|\|/)[0].trim();     // SEO ekleri at
  if(x.length>40){ x = x.slice(0,40).replace(/\s+\S*$/,''); }
  return x || n;
}
function isMobile(b){ return /^\+905\d{9}$/.test(b.phone_normalized||''); }
function waLink(b){
  const text = getTpl().replace(/\{isim\}/g, shortName(b.name));
  return 'https://wa.me/' + b.phone_normalized.replace('+','') + '?text=' + encodeURIComponent(text);
}
function setupWa(b){
  const btn=$('waBtn'), hint=$('waHint');
  $('toCallList').classList.toggle('hide', !(isMobile(b) && b.status==='new' && !b.call_list));
  $('btnWaSent').classList.toggle('hide', !isMobile(b));
  if(isMobile(b)){ btn.disabled=false; btn.textContent="WhatsApp'tan yaz";
    hint.textContent = "WhatsApp mesajı hazır yazılmış açılır. Gözden geçir, kendin gönder, sonra \"WhatsApp gönderdim\" de."; }
  else { btn.disabled=true; btn.textContent='Sabit hat, WhatsApp yok';
    hint.textContent = 'Bu numara sabit hat, arayarak ulaşabilirsin.'; }
}
$('waBtn').onclick = ()=>{
  if(!current || !isMobile(current)) return;
  if(waTodayCount >= WA_DAILY_LIMIT) toast('Bugünkü önerilen WhatsApp sınırına ulaştın (' + WA_DAILY_LIMIT + '). Yarın devam etmek numaranı korur.');
  window.open(waLink(current), '_blank', 'noopener');
};
$('tplToggle').onclick = ()=>{ $('tplText').value = getTpl(); $('tplBox').classList.toggle('hide'); };
$('tplReset').onclick  = ()=>{ setTpl(null); $('tplText').value = DEFAULT_TPL; toast('Varsayılan mesaj yüklendi'); };
$('tplSave').onclick   = ()=>{
  const v=$('tplText').value.trim();
  if(!/dur/i.test(v)){ toast('Mesajda "dur" yazarak vazgeçme cümlesi kalmalı'); return; }
  setTpl(v===DEFAULT_TPL?null:v); $('tplBox').classList.add('hide'); toast('Mesaj şablonu kaydedildi');
};

// ---- Sonuç kaydetme ----
async function save(outcome, callbackAt){
  if(!current || busy) return;
  if(['rejected','do_not_contact'].includes(outcome) && !confirm(`"${current.name}" bir daha listeye girmeyecek (arama ve WhatsApp). Onaylıyor musun?`)) return;
  busy = true;
  const { error } = await sb.rpc('log_call',{ p_business_id:current.id, p_outcome:outcome,
      p_note:$('note').value.trim()||null, p_callback_at:callbackAt||null });
  busy = false;
  if(error){ toast('Kaydedilemedi: '+error.message); return; }
  toast('Kaydedildi: '+OUTCOME_TR[outcome]);
  await refreshCounts(); await loadNext();
}
document.querySelectorAll('[data-o]').forEach(btn=>btn.addEventListener('click',()=>{
  const o=btn.dataset.o;
  if(o==='callback'){ const d=new Date(); d.setDate(d.getDate()+1); d.setHours(10,0,0,0);
    $('cbAt').value = new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
    $('cbBox').classList.remove('hide'); return; }
  save(o);
}));
$('cbSave').onclick = ()=>{ const v=$('cbAt').value; if(!v){toast('Tarih seçin');return;} save('callback', new Date(v).toISOString()); };
$('skip').onclick = async ()=>{ if(current){ skipped.add(current.id); await release(); await loadNext(); } };
$('toCallList').onclick = async ()=>{
  if(!current || busy) return; busy = true;
  const { error } = await sb.rpc('move_to_call_list',{ p_business_id:current.id });
  busy = false;
  if(error){ fail(error); return; }
  toast('Arama listesine alındı'); await refreshCounts(); await loadNext();
};

// ---- Sekmeler / Geçmiş ----
async function tab(which){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===which));
  const view = which==='hist' ? 'hist' : which==='scan' ? 'scan' : 'call';
  $('callView').classList.toggle('hide',view!=='call'); $('histView').classList.toggle('hide',view!=='hist'); $('scanView').classList.toggle('hide',view!=='scan');
  await release();
  if(view==='hist'){ loadHistory(); return; }
  if(view==='scan'){ loadScanHistory(); return; }
  list = which; skipped.clear(); $('empty').classList.add('hide'); $('biz').classList.add('hide');
  await refreshCounts(); await loadNext();
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
let hTimer; $('histSearch').oninput=()=>{ clearTimeout(hTimer); hTimer=setTimeout(loadHistory,300); };

async function loadHistory(){
  const { data, error } = await sb.rpc('search_history',{ p_term:$('histSearch').value.trim(), p_limit:150 });
  const tbl=$('histTable'); tbl.replaceChildren();
  const head=tbl.insertRow(); ['Tarih','İşletme','Sonuç','Not'].forEach(x=>{const th=document.createElement('th'); th.textContent=x; head.appendChild(th);});
  if(error){ fail(error); return; }
  (data||[]).forEach(c=>{
    const r=tbl.insertRow();
    r.insertCell().textContent = fmt(c.called_at);
    const n=r.insertCell(); n.textContent = c.name; const s=document.createElement('div'); s.className='muted'; s.textContent=c.phone_raw||''; n.appendChild(s);
    r.insertCell().textContent = (OUTCOME_TR[c.outcome]||c.outcome) + (c.callback_at ? ' → '+fmt(c.callback_at) : '');
    r.insertCell().textContent = c.note || '';
  });
}

// ---- Tarama (Supabase Edge Function: Google anahtarı sunucuda kalır) ----
const SCAN_URL = SUPABASE_URL + '/functions/v1/scan';
let scanPlan = null, scanStop = false, scanBusy = false;
window.addEventListener('beforeunload',e=>{ if(scanBusy){ e.preventDefault(); e.returnValue=''; } });
async function callScan(body){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) throw new Error('Oturum süresi doldu, yeniden giriş yapın.');
  let r;
  try{
    r = await fetch(SCAN_URL,{ method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token, 'apikey':SUPABASE_ANON_KEY }, body:JSON.stringify(body) });
  }catch(e){ throw new Error('Tarama servisine ulaşılamadı. İnternetinizi ya da servisin kurulu olduğunu kontrol edin (README > Panelden tarama).'); }
  const j = await r.json().catch(()=>({}));
  if(r.status===404) throw new Error('Tarama servisi kurulu değil. README > "Panelden tarama" adımını yapın.');
  if(r.status===401 && !j.error) throw new Error('Servis oturumu kabul etmedi. Supabase > Edge Functions > scan > Settings\'te "Verify JWT" kapalı olmalı (README).');
  if(!r.ok) throw new Error(j.message || ('Hata '+r.status));
  return j;
}
const UNIT_TR = {scan:'taranacak', recent:'90 gün içinde taranmış (atlanır)', closed:'kapalı bölge (atlanır)'};
function unitLabel(u){ return (u.district||'Tüm şehir')+' · '+u.sector; }
function scanForm(){ return { city:$('scCity').value, districts:$('scDistricts').value, sectors:$('scSectors').value }; }
function resetScanPlan(){ scanPlan=null; $('scPlanBox').classList.add('hide'); $('scRunRow').classList.add('hide'); }
['scCity','scDistricts','scSectors','scForce'].forEach(id=>$(id).addEventListener('input',()=>{ if(!scanBusy) resetScanPlan(); }));

$('scPlan').onclick = async ()=>{
  if(scanBusy) return;
  try{
    $('scPlan').disabled = true;
    const p = await callScan({ action:'plan', ...scanForm() });
    scanPlan = p;
    const box=$('scPlanBox'); box.replaceChildren(); box.classList.remove('hide');
    const force=$('scForce').checked;
    p.units.forEach(u=>{ const d=document.createElement('div'); d.className='u';
      const a=document.createElement('span'); a.textContent=p.city+' / '+unitLabel(u);
      const b=document.createElement('span'); b.textContent=UNIT_TR[u.status]; b.className=(u.status==='scan'||(force&&u.status==='recent'))?'ok':'muted'; d.append(a,b); box.appendChild(d); });
    const todo = p.units.filter(u=>u.status==='scan'||(force&&u.status==='recent')).length;
    const info=document.createElement('div'); info.className='meta'; info.style.marginTop='10px';
    info.textContent = todo ? `${todo} bölge taranacak, en çok ${todo*3} Google çağrısı. Bugün ${p.usage.used}/${p.usage.limit} çağrı kullanıldı.` : 'Taranacak bölge yok.';
    box.appendChild(info);
    $('scRunRow').classList.toggle('hide', !todo);
    $('scRun').textContent = `Taramayı başlat (${todo} bölge)`;
  }catch(e){ resetScanPlan(); toast(e.message); }
  finally{ $('scPlan').disabled=false; }
};

$('scRun').onclick = async ()=>{
  if(scanBusy || !scanPlan) return;
  const force=$('scForce').checked;
  const units = scanPlan.units.filter(u=>u.status==='scan'||(force&&u.status==='recent'));
  if(!units.length) return;
  scanBusy=true; scanStop=false;
  ['scCity','scDistricts','scSectors','scForce','scPlan'].forEach(id=>$(id).disabled=true);
  $('scRunRow').classList.add('hide'); $('scProg').classList.remove('hide'); $('scStop').disabled=false; $('scLog').replaceChildren();
  let saved=0, found=0, done=0, calls=0, stopReason='';
  const logLine=(t,cls)=>{ const d=document.createElement('div'); d.textContent=t; if(cls) d.className=cls; $('scLog').appendChild(d); };
  for(const u of units){
    if(scanStop){ stopReason='Durduruldu.'; break; }
    $('scProgTxt').textContent = `${done+1}/${units.length}: ${scanPlan.city} / ${unitLabel(u)} taranıyor…`;
    try{
      const r = await callScan({ action:'run', city:scanPlan.city, district:u.district, sector:u.sector, force });
      if(r.skipped){ logLine(`${unitLabel(u)}: ${r.message}`,'muted'); }
      else { saved+=r.saved; found+=r.found; calls+=r.calls;
        logLine(`${unitLabel(u)}: ${r.found} bulundu, ${r.matched} uygun, ${r.saved} yeni kaydedildi`+(r.warning?' (uyarı: '+r.warning+')':''), r.saved?'ok':'muted'); }
    }catch(e){ logLine(`${unitLabel(u)}: ${e.message}`,'bad'); stopReason='Hata nedeniyle durdu.'; break; }
    done++; $('scBar').style.width = Math.round(done/units.length*100)+'%';
  }
  scanBusy=false; ['scCity','scDistricts','scSectors','scForce','scPlan'].forEach(id=>$(id).disabled=false);
  $('scProg').classList.add('hide'); $('scBar').style.width='0';
  logLine(`${stopReason?stopReason+' ':''}Özet: ${found} bulundu, ${saved} yeni kaydedildi, ${calls} Google çağrısı.`, 'ok'); $('scLog').lastChild.style.fontWeight='600';
  resetScanPlan(); toast(saved?`${saved} yeni işletme eklendi`:'Yeni işletme eklenmedi');
  await Promise.all([loadScanHistory(), loadFilters(), refreshCounts()]);
};
$('scStop').onclick = ()=>{ scanStop=true; $('scStop').disabled=true; $('scProgTxt').textContent='Durduruluyor (bu bölge bitince)…'; };

async function loadScanHistory(){
  const { data, error } = await sb.from('scan_history').select('city,district,sector,scanned_at,places_found,saved').order('scanned_at',{ascending:false}).limit(10);
  const tbl=$('scHist'); tbl.replaceChildren();
  const head=tbl.insertRow(); ['Tarih','Bölge','Bulunan','Yeni'].forEach(x=>{const th=document.createElement('th'); th.textContent=x; head.appendChild(th);});
  if(error){ fail(error); return; }
  (data||[]).forEach(h=>{ const r=tbl.insertRow();
    r.insertCell().textContent=fmt(h.scanned_at);
    r.insertCell().textContent=[h.city,h.district,h.sector].filter(Boolean).join(' / ');
    r.insertCell().textContent=h.places_found; r.insertCell().textContent=h.saved; });
}

// Oturum süresi dolarsa/çıkış yapılırsa giriş ekranına dön
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT') showLogin(); });
// Sekme kapanırken açık kartın kilidini bırak
window.addEventListener('pagehide',()=>{ if(current) sb.rpc('release_business',{p_business_id:current.id}); });

init();
</script>
